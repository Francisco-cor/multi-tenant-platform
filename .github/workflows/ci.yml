name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build artifacts
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: OpenAPI drift
        run: pnpm openapi:check

      - name: Migration safety checks
        run: pnpm migrate:check

  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio12345
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Migrate (ephemeral)
        run: pnpm --filter @platform/db migrate
        env:
          DATABASE_URL: postgresql://platform:platform@localhost:5432/platform

      - name: Migrate idempotence (second run must skip)
        run: pnpm --filter @platform/db migrate
        env:
          DATABASE_URL: postgresql://platform:platform@localhost:5432/platform

      - name: Isolation integration (RLS + pool 50)
        run: pnpm --filter @platform/db test:integration
        env:
          DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
          RUN_DB_INTEGRATION: '1'

      - name: Worker integration (Redis, BullMQ and worker RLS)
        run: pnpm --filter @platform/worker test:integration
        env:
          DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
          REDIS_URL: redis://localhost:6379
          RUN_WORKER_INTEGRATION: '1'

      - name: API key integration (persistent PostgreSQL/RLS lifecycle)
        run: pnpm --filter @platform/api test:integration
        env:
          DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
          RUN_API_INTEGRATION: '1'

      - name: MinIO integration (SigV4 upload, HEAD, GET and DELETE)
        run: pnpm --filter @platform/api test:integration
        env:
          RUN_S3_INTEGRATION: '1'
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: platform-local
          S3_REGION: us-east-1
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio12345

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Dependency audit (pnpm audit --prod high)
        run: pnpm audit --prod --audit-level=high

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

      - name: SAST (CodeQL)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v3

      - name: Image scan (Trivy filesystem)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'
