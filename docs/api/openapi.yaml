openapi: 3.1.0
info:
  title: Multi-Tenant Operations Hub API
  version: 0.2.0
  description: |
    Contrato ejecutable de la API. `scripts/check-openapi.mjs` construye la app
    Fastify con adaptadores en memoria y compara esta especificación con la tabla
    real de rutas; cualquier ruta, método o esquema de seguridad que diverja falla
    el gate. El hash de `docs/api/.openapi.hash` solo recuerda revisar cambios
    intencionales del contrato.

    Autenticación: sesión web por cookie `platform_session`, token de sesión
    `Authorization: Bearer`, o API key `X-Api-Key` (solo rutas con scope válido).
    Las mutaciones con cookie requieren `X-CSRF-Token` cuando el navegador envía
    `Origin`/`Sec-Fetch-Site`, además de un origen permitido.
servers:
  - url: https://{tenant}.app.com
    variables:
      tenant:
        default: acme
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Auth
  - name: Organizations
  - name: Members
  - name: Branches
  - name: Inventory
  - name: Orders
  - name: Payments
  - name: Webhooks
  - name: API Keys
  - name: Automations
  - name: Files
  - name: DLQ
  - name: Feature Flags
  - name: Audit
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness del proceso
      responses:
        '200':
          description: El proceso está vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness con dependencias
      responses:
        '200':
          description: El proceso puede recibir tráfico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Alguna dependencia está degradada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /health/startup:
    get:
      tags: [Health]
      operationId: getStartup
      summary: Startup con dependencias
      responses:
        '200':
          description: El proceso terminó de arrancar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Alguna dependencia está degradada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Métricas Prometheus
      description: |
        Si `METRICS_TOKEN` está configurado exige `Authorization: Bearer`.
        En entornos production-like sin token responde 503. Rate limit de scrape
        1000/min por IP.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Métricas en formato Prometheus.
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/meta:
    get:
      tags: [Health]
      operationId: getApiMetadata
      summary: Metadatos de la API
      responses:
        '200':
          description: Versión y estado del servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
  /v1/auth/login:
    get:
      tags: [Auth]
      operationId: beginLogin
      summary: Inicia el flujo OIDC
      description: Devuelve un 302 al authorization endpoint y fija la cookie `oidc_state`.
      responses:
        '302':
          description: Redirección al proveedor OIDC.
          headers:
            location:
              schema: { type: string, format: uri }
            set-cookie:
              schema: { type: string }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/callback:
    get:
      tags: [Auth]
      operationId: completeLogin
      summary: Completa el flujo OIDC
      description: Valida `state`, canjea el código y fija las cookies de sesión y CSRF.
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirección a la web con sesión iniciada.
          headers:
            location:
              schema: { type: string, format: uri }
            set-cookie:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/dev-login:
    post:
      tags: [Auth]
      operationId: devLogin
      summary: Login de desarrollo
      description: Solo existe si `ALLOW_DEV_LOGIN=1`; en otro caso responde 404. Fija cookies de sesión y CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: Sesión creada.
          headers:
            set-cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Identidad de la sesión actual
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Usuario, organizaciones y organización seleccionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cierra la sesión actual
      description: Idempotente; limpia las cookies de sesión y CSRF aunque no haya sesión.
      responses:
        '200':
          description: Sesión cerrada.
          headers:
            set-cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/auth/sessions:
    delete:
      tags: [Auth]
      operationId: revokeAllSessions
      summary: Revoca todas las sesiones del usuario
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Sesiones revocadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Renueva la sesión
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Sesión renovada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/switch-organization:
    post:
      tags: [Auth]
      operationId: switchOrganization
      summary: Selecciona la organización activa
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchOrganizationRequest'
      responses:
        '200':
          description: Organización seleccionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationHostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Crea una organización
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organización creada y seleccionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationHostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/context:
    get:
      tags: [Organizations]
      operationId: getContext
      summary: Contexto tenant resuelto
      description: Requiere host de tenant válido y permiso `organization:read`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Usuario, organización, membership, roles y permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
  /v1/organization:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Organización actual
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Organización del contexto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
  /v1/branches:
    get:
      tags: [Branches]
      operationId: listBranches
      summary: Lista sucursales
      description: Cache privada por tenant; cabeceras `x-cache` y `cache-control`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Sucursales del tenant.
          headers:
            x-cache:
              schema: { type: string, enum: [HIT, MISS] }
            cache-control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Branches]
      operationId: createBranch
      summary: Crea una sucursal
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Sucursal creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/branches/{id}:
    patch:
      tags: [Branches]
      operationId: updateBranch
      summary: Actualiza una sucursal
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Sucursal actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Lista miembros
      description: Cache privada por tenant; cabeceras `x-cache` y `cache-control`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Miembros del tenant.
          headers:
            x-cache:
              schema: { type: string, enum: [HIT, MISS] }
            cache-control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/members/invitations:
    post:
      tags: [Members]
      operationId: createInvitation
      summary: Invita a un miembro
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitación creada. El token solo se devuelve con dev-login habilitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/members/invitations/{token}/accept:
    post:
      tags: [Members]
      operationId: acceptInvitation
      summary: Acepta una invitación
      description: Requiere sesión y host de tenant; el email de la sesión debe coincidir con la invitación.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 20 }
      responses:
        '200':
          description: Membership aceptada (o null si ya no está activa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/members/{membershipId}:
    patch:
      tags: [Members]
      operationId: updateMemberRole
      summary: Cambia el rol de un miembro
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Rol actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Elimina un miembro
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Membership eliminada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/inventory/reserve:
    post:
      tags: [Inventory]
      operationId: reserveInventory
      summary: Reserva stock
      description: Invalida la caché de `GET /v1/inventory`. Rate limit de endpoint 30/min por tenant.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveInventoryRequest'
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/inventory/reservations:
    get:
      tags: [Inventory]
      operationId: listInventoryReservations
      summary: Lista reservas del tenant
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Reservas del tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: Lista stock por sucursal
      description: Cache privada 30s por tenant+sucursal+query; `x-cache` HIT|MISS.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stock paginado.
          headers:
            x-cache:
              schema: { type: string, enum: [HIT, MISS] }
            cache-control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Lista órdenes
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Órdenes del tenant (máximo 25).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Crea una orden y su payment attempt
      description: |
        `Idempotency-Key` es obligatorio (16..255 caracteres URL-safe). Repetir la
        misma clave con el mismo cuerpo devuelve el resultado original y la
        cabecera `idempotent-replayed: true`; con un cuerpo distinto responde 409.
        El campo legado `body.idempotencyKey` se acepta solo como fallback.
        Rate limit de endpoint 20/min por tenant.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Orden y payment attempt creados (o replay idempotente).
          headers:
            idempotent-replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Obtiene una orden
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden del tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentAttempt
      summary: Obtiene un payment attempt
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
