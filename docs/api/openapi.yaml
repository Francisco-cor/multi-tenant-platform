openapi: 3.1.0
info:
  title: Multi-Tenant Operations Hub API
  version: 0.1.0
  description: Contrato inicial versionado. Las rutas marcadas como planned se implementan por fases.
servers:
  - url: https://{tenant}.app.com
    variables:
      tenant:
        default: acme
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Organizations
  - name: Members
  - name: Orders
  - name: Inventory
  - name: Files
  - name: Webhooks
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        '200':
          description: Process can accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v1/meta:
    get:
      tags: [Health]
      operationId: getApiMetadata
      responses:
        '200':
          description: API metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
  /v1/me:
    get:
      tags: [Organizations]
      operationId: getCurrentIdentity
      security: [{ oidc: [] }]
      responses:
        '200':
          description: Current user and authorized memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      security: [{ oidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/organizations/{organizationId}/members:
    get:
      tags: [Members]
      operationId: listMembers
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Members in the authorized organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Orders for the tenant resolved from the request context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
    post:
      tags: [Orders]
      operationId: createOrder
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/inventory/reservations:
    post:
      tags: [Inventory]
      operationId: reserveInventory
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveInventoryRequest'
      responses:
        '201':
          description: Inventory reservation created.
        '409':
          description: Insufficient stock or concurrent conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/files/presign:
    post:
      tags: [Files]
      operationId: createUploadUrl
      security: [{ oidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: Presigned upload URL.
  /v1/webhooks/{webhookId}/replay:
    post:
      tags: [Webhooks]
      operationId: replayWebhook
      security: [{ oidc: [] }]
      parameters:
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Replay job accepted.
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://issuer.example.com/.well-known/openid-configuration
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Permission denied or resource not visible in this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Request conflicts with current state or idempotency record.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
    ReadinessResponse:
      type: object
      required: [status, service, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        dependencies: { type: array, items: { type: string } }
    MetaResponse:
      type: object
      required: [apiVersion, service, status]
      properties:
        apiVersion: { type: string, example: v1 }
        service: { type: string }
        status: { type: string, enum: [ok] }
    Organization:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, suspended, archived] }
    CreateOrganizationRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    Membership:
      type: object
      required: [id, userId, organizationId, role, status]
      properties:
        id: { type: string }
        userId: { type: string }
        organizationId: { type: string }
        role: { type: string, enum: [owner, admin, manager, operator, auditor] }
        status: { type: string, enum: [invited, active, suspended, removed] }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Membership' } }
    CurrentIdentity:
      type: object
      required: [userId, memberships]
      properties:
        userId: { type: string }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
    Order:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          {
            type: string,
            enum: [draft, pending_payment, paid, processing, completed, cancelled, failed],
          }
    OrderPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
    CreateOrderRequest:
      type: object
      required: [branchId, lines]
      properties:
        branchId: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
    ReserveInventoryRequest:
      type: object
      required: [branchId, sku, quantity]
      properties:
        branchId: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
    PresignRequest:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
    CursorPage:
      type: object
      required: [data, nextCursor, hasMore]
      properties:
        data: { type: array, items: {} }
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
