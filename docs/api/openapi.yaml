    put:
      tags: [Feature Flags]
      operationId: updateFlag
      summary: Actualiza un flag
      description: Requiere owner/admin y permiso `audit:read`; escribe auditoría `flag.updated`.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagName'
