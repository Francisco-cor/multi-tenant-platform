  /v1/audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: Lista eventos de auditoría
      description: Append-only, paginado por cursor; incluye traceId, ip y resultado.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: '#/components/parameters/Cursor'
        - name: action
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Eventos de auditoría del tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrganizationSelectionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_session
      description: |
        Cookie de sesión HttpOnly. Las mutaciones desde navegador requieren
        `X-CSRF-Token` igual a la cookie `platform_csrf` y un `Origin` permitido.
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token de sesión opaco enviado como `Authorization: Bearer <token>`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key `pk_...`; las rutas que la aceptan comprueban el scope requerido por la operación.
    webhookHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        Firma HMAC-SHA256 en formato `v1,<hex>` sobre `${X-Webhook-Timestamp}.${rawBody}`.
        Tolerancia de 5 minutos. Stripe usa `Stripe-Signature` en su lugar.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    FlagName:
      name: flag
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_]{3,64}$' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave opaca de 16..255 caracteres URL-safe para deduplicar la creación.
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: '^[A-Za-z0-9._~:/+=@-]+$'
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Segundos (o milisegundos) Unix usados en la firma.
      schema: { type: string }
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      schema: { type: string, pattern: '^v1[,=][a-f0-9]{32,128}$' }
    WebhookTenantSelector:
      name: X-Tenant-Id
      in: header
      required: false
      description: Selecciona el key ring; debe coincidir con el tenant firmado del body.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Falta autenticación, la sesión/API key es inválida o la firma HMAC no verifica.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Autenticado pero sin permiso, rol, scope, CSRF u organización seleccionada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: Body, query o path inválido, o tenant host ausente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso inexistente o no visible para el tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Conflicto de estado, idempotencia, stock o unicidad.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Gone:
      description: Recurso expirado (por ejemplo una subida pendiente).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Demasiadas peticiones; respeta `retry-after` y `x-ratelimit-*`.
      headers:
        x-ratelimit-limit:
          schema: { type: integer }
        x-ratelimit-remaining:
          schema: { type: integer }
        x-ratelimit-reset:
          schema: { type: integer }
        retry-after:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Dependencia no disponible, kill switch o configuración ausente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TenantRequired:
      description: Falta un host de tenant válido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    OrganizationSelectionRequired:
      description: El usuario pertenece a varias organizaciones y debe seleccionar una.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details:
              type: object
              additionalProperties: true
    LivenessResponse:
      type: object
      required: [status, service, uptimeMs]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [api] }
        uptimeMs: { type: integer, minimum: 0 }
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, fail, skip] }
        latencyMs: { type: integer, minimum: 0 }
        error: { type: string }
    ReadinessResponse:
      type: object
      required: [status, service, dependencies, uptimeMs]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, enum: [api] }
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/HealthCheck' }
        uptimeMs: { type: integer, minimum: 0 }
    MetaResponse:
      type: object
      required: [service, status, apiVersion]
      properties:
        service: { type: string, enum: [api] }
        status: { type: string, enum: [ok] }
        apiVersion: { type: string, example: v1 }
    User:
      type: object
      required: [id, email, displayName, status]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [active, suspended] }
    Role:
      type: string
      enum: [owner, admin, manager, operator, auditor]
    Organization:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, suspended, archived] }
    OrganizationWithRole:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/Role' }
    Membership:
      type: object
      required: [id, userId, role, status]
      properties:
        id: { type: string }
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [invited, active, suspended, removed] }
    DevLoginRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId: { type: string, minLength: 1 }
    DevLoginResponse:
      type: object
      required: [user, organizations]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
    MeResponse:
      type: object
      required: [user, organizations, selectedOrganizationId]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/OrganizationWithRole' }
        selectedOrganizationId:
          type: [string, 'null']
    StatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    RevokeSessionsResponse:
      type: object
      required: [status, revoked]
      properties:
        status: { type: string, enum: [ok] }
        revoked: { type: integer, minimum: 0 }
    RefreshSessionResponse:
      type: object
      required: [status, expiresAt]
      properties:
        status: { type: string, enum: [ok] }
        expiresAt: { type: integer }
    SwitchOrganizationRequest:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug: { type: string, minLength: 1, maxLength: 63 }
    OrganizationHostResponse:
      type: object
      required: [organization, host]
      properties:
        organization: { $ref: '#/components/schemas/Organization' }
        host: { type: string }
    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ContextResponse:
      type: object
      required: [requestId, user, organization, membership, roles, permissions]
      properties:
        requestId: { type: string }
        user: { $ref: '#/components/schemas/User' }
        organization: { $ref: '#/components/schemas/Organization' }
        membership: { $ref: '#/components/schemas/Membership' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { type: string }
    OrganizationResponse:
      type: object
      required: [organization]
      properties:
        organization: { $ref: '#/components/schemas/Organization' }
    Branch:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
    BranchListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Branch' }
    BranchResponse:
      type: object
      required: [branch]
      properties:
        branch: { $ref: '#/components/schemas/Branch' }
    CreateBranchRequest:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
    UpdateBranchRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
    MembershipListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    MembershipResponse:
      type: object
      required: [membership]
      properties:
        membership: { $ref: '#/components/schemas/Membership' }
    CreateInvitationRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: '#/components/schemas/Role' }
    Invitation:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        expiresAt: { type: integer }
    InvitationResponse:
      type: object
      required: [invitation]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        token:
          type: string
          description: Solo presente cuando `ALLOW_DEV_LOGIN=1`.
    InvitationAcceptResponse:
      type: object
      required: [membership]
      properties:
        membership:
          oneOf:
            - $ref: '#/components/schemas/Membership'
            - type: 'null'
    UpdateRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
    Reservation:
      type: object
      required:
        [id, tenantId, branchId, productId, quantity, status, expiresAt, createdBy, correlationId]
      properties:
        id: { type: string }
        tenantId: { type: string }
        branchId: { type: string }
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, released, consumed, expired] }
        expiresAt: { type: integer }
        createdBy: { type: string }
        correlationId: { type: string }
    ReserveInventoryRequest:
      type: object
      required: [branchId, productId, quantity]
      additionalProperties: false
      properties:
        branchId: { type: string, minLength: 1, maxLength: 100 }
        productId: { type: string, minLength: 1, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    ReservationResponse:
      type: object
      required: [reservation]
      properties:
        reservation: { $ref: '#/components/schemas/Reservation' }
    ReservationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Reservation' }
    InventoryItem:
      type: object
      required: [productId, sku, name, branchId, available]
      properties:
        productId: { type: string }
        sku: { type: string }
        name: { type: string }
        branchId: { type: string }
        available: { type: integer, minimum: 0 }
    InventoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryItem' }
        nextCursor:
          type: [string, 'null']
    Order:
      type: object
      required: [id, tenantId, branchId, status, amountCents, currency, createdBy, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        branchId: { type: string }
        status:
          type: string
          enum: [draft, pending_payment, paid, processing, completed, cancelled, failed]
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 10 }
        createdBy: { type: string }
        createdAt: { type: integer }
    PaymentAttempt:
      type: object
      required:
        [
          id,
          tenantId,
          orderId,
          providerKey,
          status,
          providerRef,
          amountCents,
          currency,
          attempts,
          lastError,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        tenantId: { type: string }
        orderId: { type: string }
        providerKey: { type: string, pattern: '^[a-f0-9]{32}$' }
        status: { type: string, enum: [created, pending, paid, failed, unknown] }
        providerRef: { type: [string, 'null'] }
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, 'null'] }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    CreateOrderRequest:
      type: object
      required: [branchId, amountCents]
      additionalProperties: false
      properties:
        branchId: { type: string, minLength: 1, maxLength: 100 }
        amountCents: { type: integer, minimum: 1, maximum: 100000000 }
        currency: { type: string, minLength: 3, maxLength: 10, default: USD }
        paymentMethodId: { type: string, minLength: 3, maxLength: 128 }
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 255
          description: Fallback legado; se prefiere la cabecera `Idempotency-Key`.
    CreateOrderResponse:
      type: object
      required: [order, paymentAttempt]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        paymentAttempt: { $ref: '#/components/schemas/PaymentAttempt' }
    OrderResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
    OrderListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
    PaymentAttemptResponse:
      type: object
      required: [paymentAttempt]
      properties:
        paymentAttempt: { $ref: '#/components/schemas/PaymentAttempt' }
