  /v1/webhooks/payments:
    post:
      tags: [Webhooks]
      operationId: receivePaymentWebhook
      summary: Webhook firmado de pagos
      description: |
        Verifica HMAC `v1,<hex>` de `${timestamp}.${rawBody}` con tolerancia de 5
        minutos y deduplica por `eventId` y tenant. Para Stripe acepta
        `Stripe-Signature` y normaliza el evento. `X-Tenant-Id` o `?tenantId=` solo
        seleccionan el key ring; el tenant firmado del body debe coincidir.
        Devuelve 202 `unresolved` cuando el evento no puede aplicarse todavía,
        404 reintentable si aún no existe el payment attempt, y 409 si el importe
        o la moneda no coinciden con la orden.
      security:
        - webhookHmac: []
      parameters:
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
        - name: Stripe-Signature
          in: header
          required: false
          description: Firma Stripe cuando `PAYMENT_PROVIDER=stripe`.
          schema: { type: string }
        - $ref: '#/components/parameters/WebhookTenantSelector'
        - name: tenantId
          in: query
          required: false
          description: Selector de tenant alternativo a `X-Tenant-Id`.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Evento procesado, duplicado o ignorado.
          headers:
            retry-after:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'
        '202':
          description: Evento aceptado pero no resuelto; el reconciliador lo reintentará.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe payment attempt para el providerRef; reintentar.
          headers:
            retry-after:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
