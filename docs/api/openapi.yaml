openapi: 3.1.0
info:
  title: Multi-Tenant Operations Hub API
  version: 0.1.0
  description: Contrato inicial versionado. Las rutas marcadas como planned se implementan por fases.
servers:
  - url: https://{tenant}.app.com
    variables:
      tenant:
        default: acme
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Organizations
  - name: Members
  - name: Orders
  - name: Inventory
  - name: Files
  - name: Webhooks
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        '200':
          description: Process can accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v1/meta:
    get:
      tags: [Health]
      operationId: getApiMetadata
      responses:
        '200':
          description: API metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
  /v1/me:
    get:
      tags: [Organizations]
      operationId: getCurrentIdentity
      security: [{ oidc: [] }]
      responses:
        '200':
          description: Current user and authorized memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      security: [{ oidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/organizations/{organizationId}/members:
    get:
      tags: [Members]
      operationId: listMembers
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Members in the authorized organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Orders for the tenant resolved from the request context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
    post:
      tags: [Orders]
      operationId: createOrder
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      security: [{ oidc: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order tenant-scoped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payments/{paymentId}:
    get:
      tags: [Orders]
      operationId: getPaymentAttempt
      security: [{ oidc: [] }]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment attempt tenant-scoped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{orderId}/payments:
    get:
      tags: [Orders]
      operationId: listPaymentsForOrder
      security: [{ oidc: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment attempts for order, tenant-scoped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/webhooks/payments:
    post:
      tags: [Webhooks]
      operationId: inboundPaymentWebhook
      parameters:
        - name: X-Webhook-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Tenant-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Webhook processed or already_processed (dedupe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/inventory/reservations:
    post:
      tags: [Inventory]
      operationId: reserveInventory
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveInventoryRequest'
      responses:
        '201':
          description: Inventory reservation created.
        '409':
          description: Insufficient stock or concurrent conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/files/presigned-upload:
    post:
      tags: [Files]
      operationId: createPresignedUpload
      security: [{ oidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: Presigned upload URL. Key is tenants/{tenantId}/{uuid}, TTL 300s.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/files/presign:
    post:
      tags: [Files]
      operationId: createUploadUrlLegacy
      deprecated: true
      security: [{ oidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: Presigned upload URL (legacy alias).
  /v1/files:
    get:
      tags: [Files]
      operationId: listFiles
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Files for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
  /v1/files/{fileId}:
    get:
      tags: [Files]
      operationId: getFile
      security: [{ oidc: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Upload expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      tags: [Files]
      operationId: finalizeFile
      security: [{ oidc: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeFileRequest'
      responses:
        '200':
          description: File ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Upload expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/files/{fileId}/finalize:
    post:
      tags: [Files]
      operationId: finalizeFileById
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeFileRequest'
      responses:
        '200':
          description: File ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Upload expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/files/{fileId}/download:
    get:
      tags: [Files]
      operationId: getPresignedDownload
      security: [{ oidc: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Presigned download URL, TTL 60s.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedDownloadResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/files/{fileId}/presigned-download:
    get:
      tags: [Files]
      operationId: getPresignedDownloadAlias
      security: [{ oidc: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Presigned download URL alias, TTL 60s.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedDownloadResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics (outbox_lag_seconds, dlq_size, payment_unknown, payment_pending).
          content:
            text/plain:
              schema: { type: string }
  /v1/dlq:
    get:
      tags: [Health]
      operationId: listDlq
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: DLQ tenant-scoped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/dlq/{dlqId}/replay:
    post:
      tags: [Health]
      operationId: replayDlq
      security: [{ oidc: [] }]
      parameters:
        - name: dlqId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: DLQ replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqReplayResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/dlq:
    get:
      tags: [Health]
      operationId: listAdminDlq
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: DLQ admin tenant-scoped (owner/admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/dlq/{dlqId}/replay:
    post:
      tags: [Health]
      operationId: replayAdminDlq
      security: [{ oidc: [] }]
      parameters:
        - name: dlqId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: DLQ replayed (admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqReplayResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/webhooks/{webhookId}/replay:
    post:
      tags: [Webhooks]
      operationId: replayWebhook
      security: [{ oidc: [] }]
      parameters:
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Replay job accepted.
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://issuer.example.com/.well-known/openid-configuration
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Permission denied or resource not visible in this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Request conflicts with current state or idempotency record.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found or not visible in this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
    ReadinessResponse:
      type: object
      required: [status, service, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        dependencies: { type: array, items: { type: string } }
    MetaResponse:
      type: object
      required: [apiVersion, service, status]
      properties:
        apiVersion: { type: string, example: v1 }
        service: { type: string }
        status: { type: string, enum: [ok] }
    Organization:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, suspended, archived] }
    CreateOrganizationRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    Membership:
      type: object
      required: [id, userId, organizationId, role, status]
      properties:
        id: { type: string }
        userId: { type: string }
        organizationId: { type: string }
        role: { type: string, enum: [owner, admin, manager, operator, auditor] }
        status: { type: string, enum: [invited, active, suspended, removed] }
    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Membership' } }
    CurrentIdentity:
      type: object
      required: [userId, memberships]
      properties:
        userId: { type: string }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
    Order:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          {
            type: string,
            enum: [draft, pending_payment, paid, processing, completed, cancelled, failed],
          }
        branchId: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string, example: USD }
        tenantId: { type: string, format: uuid }
        createdAt: { type: integer }
    OrderPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
    CreateOrderRequest:
      type: object
      required: [branchId, amountCents]
      properties:
        branchId: { type: string }
        amountCents: { type: integer, minimum: 1, maximum: 100000000 }
        currency: { type: string, minLength: 3, maxLength: 10, default: USD }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
    PaymentAttempt:
      type: object
      required: [id, orderId, providerKey, status, amountCents, currency]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        providerKey: { type: string, pattern: '^[a-f0-9]{32}$' }
        status: { type: string, enum: [created, pending, paid, failed, unknown] }
        providerRef: { type: string, nullable: true }
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string }
        attempts: { type: integer, minimum: 0 }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    PaymentPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PaymentAttempt' } }
    PaymentWebhookRequest:
      type: object
      required: [eventId, providerRef, status]
      properties:
        eventId: { type: string, minLength: 8, maxLength: 128 }
        providerRef: { type: string, minLength: 3, maxLength: 128 }
        status: { type: string, enum: [paid, failed, unknown] }
        providerKey: { type: string }
        amountCents: { type: integer }
        tenantId: { type: string, format: uuid }
    PaymentWebhookResponse:
      type: object
      required: [status, eventId]
      properties:
        status: { type: string, enum: [processed, already_processed] }
        eventId: { type: string }
    ReserveInventoryRequest:
      type: object
      required: [branchId, sku, quantity]
      properties:
        branchId: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
    PresignRequest:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255, pattern: '^[^/\\]+$' }
        contentType: { type: string, minLength: 3, maxLength: 127 }
        size: { type: integer, minimum: 1, maximum: 52428800 }
    File:
      type: object
      required: [id, filename, contentType, sizeExpected, status]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        sizeExpected: { type: integer, minimum: 1 }
        sizeActual: { type: integer, nullable: true }
        status: { type: string, enum: [pending, ready, expired, deleted] }
        createdAt: { type: integer }
        expiresAt: { type: integer }
    FileResponse:
      type: object
      required: [file]
      properties:
        file: { $ref: '#/components/schemas/File' }
    FilePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/File' } }
    PresignedUploadResponse:
      type: object
      required: [file, upload]
      properties:
        file: { $ref: '#/components/schemas/File' }
        upload:
          type: object
          required: [url, expiresAt]
          properties:
            url: { type: string, format: uri }
            expiresAt: { type: integer }
            headers: { type: object, additionalProperties: { type: string } }
            key: { type: string }
    PresignedDownloadResponse:
      type: object
      required: [file, download]
      properties:
        file: { $ref: '#/components/schemas/File' }
        download:
          type: object
          required: [url, expiresAt]
          properties:
            url: { type: string, format: uri }
            expiresAt: { type: integer }
    FinalizeFileRequest:
      type: object
      properties:
        sizeActual: { type: integer, minimum: 1, maximum: 52428800 }
        checksum: { type: string, maxLength: 128 }
    DlqEntry:
      type: object
      required: [id, jobId, queue, cause, attempts, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string }
        queue: { type: string }
        cause: { type: string }
        attempts: { type: integer }
        status: { type: string, enum: [pending, replayed, discarded, dead_letter] }
        createdAt: { type: integer }
    DlqPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DlqEntry' } }
    DlqReplayResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [replayed] }
    CursorPage:
      type: object
      required: [data, nextCursor, hasMore]
      properties:
        data: { type: array, items: {} }
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
