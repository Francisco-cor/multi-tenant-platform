global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: platform

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API runs on the host (docker compose does not own app containers); the
  # extra_hosts mapping in docker-compose.yml exposes it as host.docker.internal.
  - job_name: api
    static_configs:
      - targets: ['host.docker.internal:4000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # In local, no alertmanager; in prod set alertmanager:9093
