packages:
  - apps/*
  - packages/*

allowBuilds:
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: true

minimumReleaseAge: 10080
# Reviewed exceptions: these are pinned transitive versions required by the
# toolchain that were published inside the 7-day window when the lockfile was
# refreshed. Remove an entry after the package ages out and the lock is updated.
minimumReleaseAgeExclude:
  - postcss@8.5.33
  - '@babel/helper-string-parser@7.29.14'
  - '@babel/parser@7.29.14'
  - '@babel/types@7.29.14'

blockExoticSubdeps: true
trustPolicy: no-downgrade
# semver 6.x is pulled by transitive tooling that still supports older Node.
# The advisory is a trust-metadata downgrade, not a code vulnerability.
trustPolicyExclude:
  - semver@6.3.1

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

overrides:
  fast-uri@^3.0.0: ^3.1.9
  fast-uri@^4.0.0: ^4.1.5
  postcss: ^8.5.33
  sharp: ^0.35.5
  source-map-js: ^1.2.2
